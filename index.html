<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ahamad Fuwad — Journalist & Documentary Filmmaker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --navy: #1a2744; --navy-dark: #111c33; --navy-mid: #223058;
      --forest: #2d4a3e; --burgundy: #6b2737; --burgundy-light: #8a3347;
      --cream: #f5f0e8; --cream-dark: #ede6d6;
      --gold: #c9a84c; --gold-light: #e2c476;
      --white: #faf9f7; --text-light: #9aa4b8;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--navy-dark);
      color: var(--white);
      min-height: 100vh;
    }
    nav {
      background: var(--navy);
      border-bottom: 1px solid var(--navy-mid);
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--gold-light);
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }
    .nav-links a {
      color: var(--text-light);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
      cursor: pointer;
    }
    .nav-links a:hover { color: var(--gold-light); }
    section { display: none; padding: 3rem 2rem; max-width: 1000px; margin: 0 auto; }
    section.active { display: block; }
    .hero {
      text-align: center;
      padding: 4rem 1rem 2rem;
    }
    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      color: var(--white);
      margin-bottom: 0.5rem;
    }
    .hero p {
      color: var(--gold-light);
      font-size: 1.2rem;
      font-weight: 300;
    }
    footer {
      border-top: 1px solid var(--navy-mid);
      text-align: center;
      padding: 2rem;
      color: var(--text-light);
      font-size: 0.85rem;
      margin-top: 4rem;
    }
    footer span { color: var(--gold); }
    .field-group { margin-bottom: 1.2rem; }
    .field-label { display: block; margin-bottom: 0.4rem; color: var(--text-light); font-size: 0.9rem; }
    .field-input {
      width: 100%;
      padding: 0.75rem;
      background: var(--navy);
      border: 1px solid var(--navy-mid);
      color: var(--white);
      border-radius: 4px;
      font-family: inherit;
    }
    textarea.field-input { min-height: 120px; resize: vertical; }
    .submit-btn {
      background: var(--burgundy);
      color: var(--white);
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    .submit-btn:hover { background: var(--burgundy-light); }
  </style>
</head>
<body>

  <nav>
    <a href="#" class="nav-brand" onclick="showSection('home')">Ahamad Fuwad</a>
    <ul class="nav-links">
      <li><a onclick="showSection('home')">Home</a></li>
      <li><a onclick="showSection('work')">Work</a></li>
      <li><a onclick="showSection('about')">About</a></li>
      <li><a onclick="showSection('contact')">Contact</a></li>
    </ul>
  </nav>

  <section id="home" class="active">
    <div class="hero">
      <h1>Ahamad Fuwad</h1>
      <p>Journalist &amp; Documentary Filmmaker</p>
    </div>
  </section>

  <section id="work">
    <h2>Selected Work</h2>
  </section>

  <section id="about">
    <h2>About Ahamad</h2>
  </section>

  <section id="contact">
    <h2>Get in Touch</h2>
    <div class="contact-container">
      <form action="https://formspree.io/f/xbjnqkyv" method="POST">
        <div class="field-group">
          <label class="field-label">Name</label>
          <input class="field-input" type="text" name="name" placeholder="Your name" required />
        </div>
        <div class="field-group">
          <label class="field-label">Email</label>
          <input class="field-input" type="email" name="_replyto" placeholder="your@email.com" required />
        </div>
        <div class="field-group">
          <label class="field-label">Message</label>
          <textarea class="field-input" name="message" placeholder="Tell me about the story or project..." required></textarea>
        </div>
        <input type="hidden" name="_to" value="fuwadahamad@gmail.com">
        <button class="submit-btn" type="submit">Send message</button>
      </form>
    </div>
  </section>

  <footer>
    <p>Ahamad Fuwad — Journalist &amp; Documentary Filmmaker</p>
    <p>© 2026 <span>·</span> California</p>
  </footer>

  <script>
    function showSection(id) {
      document.querySelectorAll('section').forEach(function(s) { s.classList.remove('active'); });
      document.getElementById(id).classList.add('active');
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
